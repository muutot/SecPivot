[package]
name = "secpivot-desktop"
version = "1.1.0"
description = "A professional, compact KeePass client built with Tauri and Rust"
authors = []
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "secpivot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
keepass = { version = "0.13", features = ["save_kdbx4", "totp"] }
# NOTE: keepass 0.13's KdfConfig::Argon2id.version uses rust-argon2 v3's
# `argon2::Version` type, so the crate name here must match that version.
rust-argon2 = "3"
uuid = "1"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-opener = "2"
enigo = "0.6"
tauri-plugin-global-shortcut = "2"
keyring = "4.1.6"
rust-s3 = "0.34"
tokio = { version = "1", features = ["rt-multi-thread"] }
zeroize = "1"
# KeePassHttp browser bridge crypto (all already vendored in Cargo.lock).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
block-padding = "0.3"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
getrandom = "0.2"
# KeePassRPC bridge (Phase 2): SRP big-number math + WebSocket loopback server.
num-bigint = "0.4"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Download favicons (KeePass "Download Favicons"); TLS via rustls, no native deps.
reqwest = { version = "0.13", features = ["rustls", "blocking"] }
url = "2"
# Parse WebDAV PROPFIND multistatus responses (same minor as keepass/rust-s3's
# vendored copy, so no extra crate version enters the lock).
quick-xml = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
