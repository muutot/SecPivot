[package]
name = "secpivot-desktop"
version = "1.3.0"
description = "A professional, compact KeePass client built with Tauri and Rust"
authors = []
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "secpivot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
keepass = { version = "0.13", features = ["save_kdbx4", "totp", "_merge"] }
# NOTE: keepass 0.13's KdfConfig::Argon2id.version uses rust-argon2 v3's
# `argon2::Version` type, so the crate name here must match that version.
rust-argon2 = "3"
uuid = "1"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
zeroize = "1"
# KeePassHttp bridge / KeePassRPC AES-256-CBC wire crypto (desktop-only, see
# desktop target section). hmac/sha2/sha1/base64/getrandom stay shared because
# vault hashing, TOTP and breach-check all use them.
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
getrandom = "0.2"
# Download favicons (KeePass "Download Favicons"); TLS via rustls, no native deps.
reqwest = { version = "0.13", features = ["rustls", "blocking"] }
url = "2"
# Parse WebDAV PROPFIND multistatus responses (same minor as keepass/rust-s3's
# vendored copy, so no extra crate version enters the lock).
quick-xml = "0.30"
# KeePassRPC entry match accuracy: Perl-compatible regex matching for
# per-entry URL/pattern rules (altURLs/blockedURLs/regExURLs/regExBlockedURLs).
regex = "1"
# S3 remote vault transport. TODO(D): replaced by hand-rolled SigV4 over the
# rustls reqwest client; until then it pulls native-tls → openssl and the
# Android build needs the vendored OpenSSL target below.
rust-s3 = "0.34"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Registry"] }

# Desktop-only dependencies. `cfg(desktop)`/`cfg(mobile)` are set by the
# tauri-build build script and are NOT visible to Cargo's target resolution,
# so this section pins the explicit desktop OS set instead. Nothing here is
# compiled or linked for the Android target, which keeps the mobile APK lean.
# - enigo: auto-type keystroke replay (platform/autotype execution).
# - tauri-plugin-global-shortcut: desktop global hotkey (lib.rs, cfg(desktop)).
# - keyring: saved-credential store backed by OS credential vaults.
# - tungstenite + num-bigint: KeePassRPC loopback server (rpc module).
# - aes/cbc/cipher/block-padding: bridge/RPC AES-256-CBC wire crypto
#   (crypto/primitives.rs, cfg(desktop)).
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
enigo = "0.6"
tauri-plugin-global-shortcut = "2"
keyring = "4.1.6"
# KeePassRPC bridge (Phase 2): SRP big-number math + WebSocket loopback server.
num-bigint = "0.4"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# KeePassHttp / KeePassRPC AES-256-CBC wire crypto.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
block-padding = "0.3"

# Android: openssl-sys is pulled in via native-tls (rust-s3's tokio client — the
# tokio backend hardwires native-tls, so no feature switch can avoid it). The NDK
# ships no OpenSSL, so we build a vendored OpenSSL with openssl-src for the Android
# target. openssl-src cannot cross-compile OpenSSL from a native Windows host
# (OpenSSL refuses the Windows perl path format), hence the release workflow's
# android job runs on ubuntu-latest where openssl-src + NDK clang work. Windows
# desktop is unaffected (native-tls uses schannel there, no openssl-sys).

[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"

# Dev-profile tuning for the fastest possible local `tauri dev` builds:
# - dependencies stay unoptimized (opt-level 0) with no debug symbols, so the
#   existing cached artifacts are reused and compile/link is as fast as possible.
# - unpacked split debug info keeps MSVC PDB handling fast (local crate only).
[profile.dev]
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 0
debug = false

# CI profile: same debug symbols as dev, but dependencies stay at opt-level 0
# so clippy/test runs compile as fast as possible in GitHub Actions.
[profile.ci]
inherits = "dev"

[profile.ci.package."*"]
opt-level = 0

# Release profile for local `tauri build`: like dev, extreme build speed with
# minimal storage. No debug info, no incremental cache, unoptimized objects.
# The GitHub Actions release job overrides these via CARGO_PROFILE_RELEASE_*
# env vars to enable extreme runtime optimization (see release.yml).
[profile.release]
opt-level = 0
codegen-units = 256
panic = "abort"
strip = true
debug = false
incremental = false
