[package]
name = "tauri-plugin-saf"
version = "0.1.0"
edition = "2021"
description = "Android Storage Access Framework picker with persistable URI grants for SecPivot"
license = "MIT"
links = "tauri-plugin-saf"

[lib]
name = "tauri_plugin_saf"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
