name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Tag push → use the pushed tag; manual dispatch → build the tag from the
  # version input so `tauri-action` names the release/tag consistently.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  build:
    name: Build (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node_modules
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare release body
        id: release_body
        shell: bash
        run: |
          if [ -f RELEASE.md ]; then
            echo "body<<BODY_EOF" >> "$GITHUB_OUTPUT"
            cat RELEASE.md >> "$GITHUB_OUTPUT"
            echo "BODY_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body=See CHANGELOG.md for details." >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "SecPivot Desktop v__VERSION__"
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Package portable ZIP (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $exe = "${{ github.workspace }}\src-tauri\target\${{ matrix.target }}\release\secpivot-desktop.exe"
          $ver = $env:RELEASE_TAG.TrimStart("v")
          if (Test-Path $exe) {
            & scripts/package-portable.ps1 -SkipBuild -ReleaseExe $exe -Version $ver
          } else {
            Write-Host "Portable exe not found at $exe — skipping portable package."
          }

      - name: Upload portable ZIP to release (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $zip = Get-ChildItem "dist\SecPivot-*-portable.zip" -ErrorAction SilentlyContinue
          if ($zip) {
            gh release upload "$env:RELEASE_TAG" $zip.FullName --clobber
            Write-Host "Uploaded $($zip.Name)"
          } else {
            Write-Host "No portable ZIP found — nothing to upload."
          }
