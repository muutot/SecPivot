name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Tag push → use the pushed tag; manual dispatch → build the tag from the
  # version input so `tauri-action` names the release/tag consistently.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Validate release identity
        run: node scripts/validate-release-version.mjs

      - name: Verify
        run: npm run verify

      - name: Verify extreme release build
        env:
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: cargo build -j 2 --profile release --manifest-path src-tauri/Cargo.toml

  build:
    name: Build (Windows x64)
    needs: verify
    runs-on: windows-latest
    env:
      # Extreme runtime optimization is enabled ONLY here, in the GitHub release
      # build. Local `tauri build` and CI stay fast (see src-tauri/Cargo.toml).
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      RUSTFLAGS: -C target-cpu=x86-64-v3
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Prepare release body
        id: release_body
        shell: bash
        run: |
          if [ -f RELEASE.md ]; then
            echo "body<<BODY_EOF" >> "$GITHUB_OUTPUT"
            cat RELEASE.md >> "$GITHUB_OUTPUT"
            echo "BODY_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body=See CHANGELOG.md for details." >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "SecPivot Desktop v__VERSION__"
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

      - name: Package portable ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $exe = "${{ github.workspace }}\src-tauri\target\release\secpivot-desktop.exe"
          $ver = $env:RELEASE_TAG.TrimStart("v")
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Portable exe not found at $exe."
          }
          & scripts/package-portable.ps1 -SkipBuild -ReleaseExe $exe -Version $ver
          $zip = "${{ github.workspace }}\dist\SecPivot-$ver-portable.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Portable ZIP was not produced at $zip."
          }

      - name: Upload portable ZIP to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $ver = $env:RELEASE_TAG.TrimStart("v")
          $zip = "${{ github.workspace }}\dist\SecPivot-$ver-portable.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Portable ZIP not found at $zip."
          }
          gh release upload "$env:RELEASE_TAG" $zip --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Portable ZIP upload failed with exit code $LASTEXITCODE."
          }
          Write-Host "Uploaded $(Split-Path -Leaf $zip)"

  android:
    name: Build (Android APK)
    # Parallel to the Windows build: runs as soon as verification passes. The
    # job must stay on Linux — openssl-src (vendored OpenSSL for the Android
    # target) cannot cross-compile OpenSSL from a native Windows host.
    needs: verify
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: npx tauri android init --ci --skip-targets-install
        working-directory: src-tauri

      - name: Configure Android NDK tools
        shell: bash
        run: |
          if [ -n "${NDK_HOME:-}" ] && [ -d "$NDK_HOME" ]; then
            ndk_dir="$NDK_HOME"
          else
            # Match Tauri's fallback: lexically sort installed NDK paths and
            # select the last one, then pin that same directory for the build.
            ndk_dir=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | LC_ALL=C sort | tail -n 1)
          fi
          if [ -z "$ndk_dir" ]; then
            echo "No Android NDK installation found under $ANDROID_HOME/ndk." >&2
            exit 1
          fi
          ranlib="$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          if [ ! -x "$ranlib" ]; then
            echo "Android NDK llvm-ranlib not found at $ranlib." >&2
            exit 1
          fi
          echo "NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "TARGET_RANLIB=$ranlib" >> "$GITHUB_ENV"

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: pwsh
        run: ./scripts/configure-android-signing.ps1

      - name: Build Android APK (release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: npx tauri android build --apk --ci
        working-directory: src-tauri

      - name: Verify Android release APK
        shell: bash
        run: |
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Android release APK not found at $apk." >&2
            exit 1
          fi
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apksigner="$build_tools/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "Android apksigner not found at $apksigner." >&2
            exit 1
          fi
          "$apksigner" verify --verbose "$apk"

      - name: Upload Android APK to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          # The Windows build job creates the release via tauri-action; this job
          # runs in parallel, so wait for the release to exist before uploading.
          release_ready=false
          for i in $(seq 1 90); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              release_ready=true
              break
            fi
            sleep 10
          done
          if [ "$release_ready" != true ]; then
            echo "Release $RELEASE_TAG was not created within 15 minutes." >&2
            exit 1
          fi
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Android release APK not found at $apk." >&2
            exit 1
          fi
          asset="$RUNNER_TEMP/SecPivot-${RELEASE_TAG#v}-android-universal.apk"
          cp "$apk" "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber
          echo "Uploaded $(basename "$asset")"
