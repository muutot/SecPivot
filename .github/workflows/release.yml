name: Release

on:
  push:
    tags:
      # Stable releases and prereleases. The filter cannot express a full
      # semver, so the `validate` job is the real gate: it rejects anything
      # that is not the repository version.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true
        type: string

# Least privilege by default. Only the jobs that publish need `contents: write`;
# `verify` merely runs the test suite and `android` only produces an artifact.
permissions:
  contents: read

# One release run per tag. A re-pushed or manually re-dispatched tag must not
# race another run rewriting the same published release assets.
#
# The `env` context is NOT available in `concurrency` (only `github`, `inputs`,
# `vars`), so the release tag is inlined here instead of using `env.RELEASE_TAG`
# — referring to `env.RELEASE_TAG` here fails workflow validation with
# "Unrecognized named-value: 'env'" and no job ever starts.
concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

env:
  # Tag push — use the pushed tag; manual dispatch — build the tag from the
  # version input so `tauri-action` names the release/tag consistently.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  # Cheap fail-fast gate: the release tag must match every version source
  # before any expensive job starts. It only reads files, so Linux keeps it to
  # a few seconds.
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history + tags: the identity gate also proves that the
          # checked-out commit is the one the release tag points at, so a
          # manual dispatch on a branch that moved past the tag is rejected
          # before any expensive job starts.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Validate release identity
        run: node scripts/validate-release-version.mjs

  # Test/lint gate. It deliberately does NOT rebuild the extreme release
  # profile: `build` compiles that exact configuration anyway, so a second
  # fat-LTO build here only duplicated 16-23 minutes of wall clock on every
  # release. This job runs in parallel with `build`/`android`; `verify` gates
  # the Android upload and turns the run red, while the release stays a draft
  # until a human publishes it.
  verify:
    name: Verify
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      # No `toolchain:` input on purpose: the action's default (`stable`) is
      # installed but immediately overridden by the repository's
      # `rust-toolchain.toml` (channel 1.96.0), which is the single source of
      # truth for the compiler pin. Bump the TOML, not this line.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      # No sccache here: this job only produces dev/test profile artifacts,
      # which the release-profile `build` job cannot reuse. Caching them
      # separately only competed for the 10 GB Actions cache budget.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # GitHub scopes caches per ref: a tarball written by tag v1.6.3 can
          # never be restored by v1.6.4, so saving one only burns the post-job
          # upload and evicts the default-branch caches. Restore-only on tags;
          # manual dispatches on `main` keep saving a reusable cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  build:
    name: Build (Windows x64)
    # The release is only published when the test suite is green, so the
    # Windows artifacts must wait for `verify` as well. Otherwise a red run
    # still leaves a complete draft release that a human can publish.
    needs: [validate, verify]
    runs-on: windows-latest
    # This job only builds. It runs no third-party build code with a write
    # token: the draft release is created by the separate `publish` job.
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      # Extreme runtime optimization is enabled ONLY here, in the GitHub release
      # build. Local `tauri build` and CI stay fast (see src-tauri/Cargo.toml).
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      RUSTFLAGS: -C target-cpu=x86-64-v2
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The token must not stay in .git/config: any build script (npm
          # dependency, cargo build.rs) could read it from there.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      # No `toolchain:` input on purpose: the action's default (`stable`) is
      # installed but immediately overridden by the repository's
      # `rust-toolchain.toml` (channel 1.96.0), which is the single source of
      # truth for the compiler pin. Bump the TOML, not this line.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Restore only the cargo registry/bin: the release profile is cold on
      # every tag, so a cached target tree cannot be reused, and the multi-GB
      # target archive cost 1-2 minutes to upload while competing with sccache
      # for the 10 GB Actions cache budget. sccache still covers same-ref
      # retries and re-runs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        # The build runs without any release token: `tauri-action` is gone
        # from the pipeline because it builds *and* publishes, which put the
        # write token in reach of every build script. The release itself is
        # created by the separate `publish` job from the artifacts produced
        # here.
        run: npx tauri build --bundles nsis --ci

      - name: Package portable ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $exe = "${{ github.workspace }}\src-tauri\target\release\secpivot-desktop.exe"
          $ver = $env:RELEASE_TAG.TrimStart("v")
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Portable exe not found at $exe."
          }
          & scripts/package-portable.ps1 -SkipBuild -ReleaseExe $exe -Version $ver
          $zip = "${{ github.workspace }}\dist\SecPivot-$ver-portable.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Portable ZIP was not produced at $zip."
          }

      - name: Generate Windows SHA256SUMS
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $ver = $env:RELEASE_TAG.TrimStart("v")
          $nsis = "${{ github.workspace }}\src-tauri\target\release\bundle\nsis\SecPivot_$($ver)_x64-setup.exe"
          $zip = "${{ github.workspace }}\dist\SecPivot-$ver-portable.zip"
          foreach ($artifact in @($nsis, $zip)) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Artifact for checksumming not found at $artifact."
            }
          }
          $sumsFile = "${{ github.workspace }}\dist\SHA256SUMS-windows.txt"
          $lines = @()
          foreach ($artifact in @($nsis, $zip)) {
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $(Split-Path -Leaf $artifact)"
          }
          Set-Content -LiteralPath $sumsFile -Value $lines -Encoding ascii

      - name: Stage Windows release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $ver = $env:RELEASE_TAG.TrimStart("v")
          $nsis = "${{ github.workspace }}\src-tauri\target\release\bundle\nsis\SecPivot_$($ver)_x64-setup.exe"
          $zip = "${{ github.workspace }}\dist\SecPivot-$ver-portable.zip"
          $stage = "${{ github.workspace }}\dist\release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($artifact in @($nsis, $zip)) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Release artifact not found at $artifact."
            }
            Copy-Item -LiteralPath $artifact -Destination $stage -Force
          }
          Copy-Item -LiteralPath "${{ github.workspace }}\dist\SHA256SUMS-windows.txt" -Destination $stage -Force
          Get-ChildItem -LiteralPath $stage | ForEach-Object { Write-Host "Staged $($_.Name)" }

      - name: Preserve Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release
          # A flat directory: upload-artifact keeps the paths relative to the
          # common root of the matched files, so a multi-directory path list
          # would nest the artifacts and the publish job would not find them.
          path: dist/release/*
          if-no-files-found: error
          retention-days: 1

  # The only job that talks to the release API. It runs no build code: it
  # downloads the artifacts produced by the read-only `build` job and creates
  # the draft release from them, so a compromised dependency can never reach
  # the write token.
  publish:
    name: Publish (Windows)
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-release
          path: dist/windows

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          ver="${RELEASE_TAG#v}"
          notes="dist/windows/RELEASE.md"
          if [ -f RELEASE.md ]; then
            cp RELEASE.md "$notes"
          else
            echo "See CHANGELOG.md for details." > "$notes"
          fi
          assets=(dist/windows/*.exe dist/windows/*.zip dist/windows/SHA256SUMS-windows.txt)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Windows release asset to publish." >&2
            exit 1
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run replaces the assets of the existing draft release.
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            echo "Updated existing release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              "${prerelease[@]}" \
              --title "v${ver}" \
              --notes-file "$notes" \
              "${assets[@]}"
            echo "Created draft release $RELEASE_TAG"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

  android:
    name: Build (Android APK)
    # Parallel to the Windows build and to verification: only the cheap
    # version-identity gate is a dependency. `publish-android` requires a green
    # `verify`, so a failing test suite keeps the APKs off the draft.
    # The job must stay on Linux — openssl-src (vendored OpenSSL for the
    # Android target) cannot cross-compile OpenSSL from a native Windows host.
    #
    # On by default for the canonical repository, where the release signing
    # secrets are configured: a release without an APK is a regression. Forks
    # are excluded by the repository check (they have no signing secrets, so
    # the `sign-android` job could not produce a signed APK anyway); set
    # `ANDROID_RELEASE_ENABLED=false` for a deliberate Windows-only release.
    # Missing secrets on the canonical repo still fail closed in the
    # `sign-android` job.
    if: ${{ github.repository == 'muutot/SecPivot' && vars.ANDROID_RELEASE_ENABLED != 'false' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Same extreme runtime optimization as the Windows build (fat LTO, opt3,
      # cgu1). target-cpu is x86-64 specific and is NOT applied here �?each of
      # the two Android ABIs is tuned by the NDK target instead. Without these
      # overrides the local fast `release` profile (opt-level 0, cgu 256) would
      # ship an unoptimized, much larger native library in every ABI.
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # No build script in this job may read a release token.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      # No `toolchain:` input on purpose: the action's default (`stable`) is
      # installed but immediately overridden by the repository's
      # `rust-toolchain.toml` (channel 1.96.0), which is the single source of
      # truth for the compiler pin. Bump the TOML, not this line.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          # 64-bit ABIs only: armv7/i686 32-bit targets are not shipped.
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          # v4 defaults to `packages: tools platform-tools`, but the hosted
          # runner's SDK repository no longer publishes the legacy `tools`
          # package, so sdkmanager exits 1 before the build starts. The image
          # already ships the NDK/platform/build-tools; accepting licenses and
          # refreshing platform-tools is all this step needs.
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: npx tauri android init --ci --skip-targets-install
        working-directory: src-tauri

      - name: Patch Android Gradle repositories
        # The generated buildSrc project resolves the Kotlin Gradle plugin
        # from plugins.gradle.org only; when that mirror is out of sync
        # (plugin POM present, parent BOM missing) the whole build fails in
        # `:buildSrc` configuration. Ensure google()/mavenCentral() fallbacks
        # before any gradlew invocation. See scripts/patch-android-gradle-repos.ps1.
        shell: pwsh
        run: ./scripts/patch-android-gradle-repos.ps1

      - name: Configure Android NDK tools
        shell: bash
        run: |
          if [ -n "${NDK_HOME:-}" ] && [ -d "$NDK_HOME" ]; then
            ndk_dir="$NDK_HOME"
          else
            # Match Tauri's fallback: lexically sort installed NDK paths and
            # select the last one, then pin that same directory for the build.
            ndk_dir=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | LC_ALL=C sort | tail -n 1)
          fi
          if [ -z "$ndk_dir" ]; then
            echo "No Android NDK installation found under $ANDROID_HOME/ndk." >&2
            exit 1
          fi
          ranlib="$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          if [ ! -x "$ranlib" ]; then
            echo "Android NDK llvm-ranlib not found at $ranlib." >&2
            exit 1
          fi
          echo "NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "TARGET_RANLIB=$ranlib" >> "$GITHUB_ENV"

      - name: Build unsigned release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle_file="src-tauri/gen/android/app/build.gradle.kts"
          if [ -f "$gradle_file" ]; then
            # The template signs the release build type with the throwaway
            # debug key. The release key is applied by the separate signing
            # job, so the built APK must stay unsigned: re-signing an
            # already signed APK is not a supported apksigner flow.
            sed -i '/signingConfig\s*=\s*signingConfigs\.getByName("debug")/d' "$gradle_file"
            if grep -q 'signingConfig' "$gradle_file"; then
              echo "Remaining signingConfig references:" >&2
              grep -n 'signingConfig' "$gradle_file" >&2
            else
              echo "Release APK will be built unsigned."
            fi
          fi

      - name: Build Android APKs (release, per-ABI)
        # The build runs WITHOUT any signing secret: the generated project
        # signs with the throwaway debug keystore, and the `sign-android` job
        # re-signs the produced APKs with the release key in a job that
        # executes no npm, Gradle or cargo build code. A compromised build
        # dependency can therefore never read the release keystore.
        # `--split-per-abi` emits one APK per architecture
        # (`apk/<arch>/release/app-<arch>-release.apk`) instead of a fat
        # universal APK, cutting per-device download size to a quarter.
        # `--target` restricts to the shipped 64-bit ABIs.
        run: npx tauri android build --apk --ci --split-per-abi --target aarch64 --target x86_64
        working-directory: src-tauri

      - name: Verify unsigned Android release APKs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No Android release APK produced under src-tauri/gen/android/app/build/outputs/apk/." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            # cargo-mobile2 writes per-ABI APKs to
            #   app/build/outputs/apk/<arch>/release/app-<arch>-release.apk
            # so the ABI flavor is the directory two levels above the file.
            # Assert the packaged APK really carries that native ABI; an
            # x86_64-only APK once shipped for an arm64 phone because this
            # path was misread as .../apk/release/.
            flavor=$(basename "$(dirname "$(dirname "$apk")")")
            case "$flavor" in
              arm64) abi="arm64-v8a" ;;
              x86_64) abi="x86_64" ;;
              *) abi="$flavor" ;;
            esac
            if ! unzip -l "$apk" | grep -q "lib/${abi}/"; then
              echo "APK ${apk} does not contain lib/${abi}/." >&2
              exit 1
            fi
          done

      - name: Stage unsigned Android release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No Android release APK produced under src-tauri/gen/android/app/build/outputs/apk/." >&2
            exit 1
          fi
          mkdir -p dist/unsigned
          for apk in "${apks[@]}"; do
            # The ABI flavor is two directories above the file
            # (apk/<arch>/release/<apk>). Using the immediate parent gave
            # every ABI the name `...-android-release.apk`, so the copies
            # collided and only the last one survived; the published release
            # then carried an x86_64-only APK that could not install on an
            # arm64 phone. Map cargo-mobile2's arch flavor to the canonical
            # Android ABI name used in the asset filename.
            flavor=$(basename "$(dirname "$(dirname "$apk")")")
            case "$flavor" in
              arm64) abi="arm64-v8a" ;;
              x86_64) abi="x86_64" ;;
              *) abi="$flavor" ;;
            esac
            asset="dist/unsigned/SecPivot-${RELEASE_TAG#v}-android-${abi}.apk"
            cp "$apk" "$asset"
            echo "Staged $(basename "$asset")"
          done
          # Fail closed: every shipped 64-bit ABI must be present as a distinct
          # asset. A missing arm64-v8a build is a broken release, not a warning.
          for abi in arm64-v8a x86_64; do
            asset="dist/unsigned/SecPivot-${RELEASE_TAG#v}-android-${abi}.apk"
            if [ ! -f "$asset" ]; then
              echo "Expected Android release asset for ABI ${abi} was not staged (${asset})." >&2
              exit 1
            fi
          done

      - name: Preserve unsigned Android release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release-apk-unsigned
          path: dist/unsigned/*.apk
          if-no-files-found: error
          retention-days: 1

  # Signing runs in its own job so the release keystore never coexists with
  # third-party build code. This job downloads the built APKs, re-signs them
  # with the release key, verifies the result, and publishes the signed
  # artifacts. It runs no npm script, no Gradle task and no cargo build.
  sign-android:
    name: Sign (Android APK)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: android-release-apk-unsigned
          path: dist/unsigned

      # apksigner is a Java tool: the signing job needs a JRE, exactly like
      # the build job that produced the APKs.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      # The signing job needs the Android SDK build tools. The hosted image
      # used to ship them, but `ubuntu-latest` is migrating to a new image
      # that does not, so the SDK is set up here with exactly the same
      # configuration the `android` job uses (a package spec without a
      # version is rejected by the action).
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Sign release APKs with the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          set -x
          shopt -s nullglob
          # Locate the SDK: the environment variable first, then the usual
          # install locations of the hosted image.
          sdk_root="${ANDROID_HOME:-}"
          for candidate in "$sdk_root" "$HOME/Android/Sdk" /usr/local/lib/android/sdk /opt/android-sdk; do
            if [ -n "$candidate" ] && [ -d "$candidate/build-tools" ]; then
              sdk_root="$candidate"
              break
            fi
          done
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/build-tools" ]; then
            echo "Android build-tools not found (ANDROID_HOME=${ANDROID_HOME:-unset})." >&2
            exit 1
          fi
          build_tools=$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apksigner="$build_tools/apksigner"
          echo "SDK root: $sdk_root"
          echo "Build tools: $build_tools"
          ls -1 "$build_tools" | head -20
          if [ ! -x "$apksigner" ]; then
            echo "Android apksigner not found at $apksigner." >&2
            exit 1
          fi
          if ! command -v java >/dev/null 2>&1; then
            echo "java is not on PATH; apksigner cannot run." >&2
            exit 1
          fi
          java -version
          # The keystore is decoded into a private temporary directory that is
          # never part of a checked-out workspace, and it is removed when the
          # job ends.
          keystore_dir=$(mktemp -d)
          keystore="$keystore_dir/secpivot-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          unsigned=(dist/unsigned/*.apk)
          if [ ${#unsigned[@]} -eq 0 ]; then
            echo "No unsigned Android APK to sign." >&2
            exit 1
          fi
          mkdir -p dist/android
          for apk in "${unsigned[@]}"; do
            name=$(basename "$apk")
            abi="${name##*-}"
            abi="${abi%.apk}"
            out="dist/android/$name"
            # Drop the debug keystore's v1 signature files before re-signing
            # (apksigner replaces the v2/v3 block itself). `zip -d` exits 12
            # when there is nothing to remove, which is not a failure here.
            zip -d "$apk" 'META-INF/*.RSA' 'META-INF/*.SF' 'META-INF/*.MF' >/dev/null 2>&1 || true
            "$apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "$out" "$apk"
            "$apksigner" verify --verbose "$out"
            # The listing is written to a file first: `unzip | grep -q` makes
            # grep exit early, which SIGPIPEs unzip, and `set -o pipefail`
            # would then fail the step even though the check passed.
            unzip -l "$out" > "$out.listing"
            if ! grep -q "lib/${abi}/" "$out.listing"; then
              echo "Signed APK ${out} does not contain lib/${abi}/." >&2
              exit 1
            fi
            rm -f "$out.listing"
            echo "Signed $(basename "$out")"
          done
          rm -f "$keystore"
          rm -rf "$keystore_dir"

      - name: Generate Android SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          sums="dist/android/SHA256SUMS-android.txt"
          : > "$sums"
          for asset in dist/android/*.apk; do
            hash=$(sha256sum "$asset" | cut -d' ' -f1)
            printf '%s  %s\n' "$hash" "$(basename "$asset")" >> "$sums"
          done
          cat "$sums"

      - name: Preserve signed Android release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release-apk
          path: |
            dist/android/*.apk
            dist/android/SHA256SUMS-android.txt
          if-no-files-found: error
          retention-days: 1

  publish-android:
    name: Publish (Android APK)
    # Only run when verification, the Windows release and the Android signing
    # job all produced usable assets. The build is on by default on the
    # canonical repository (`vars.ANDROID_RELEASE_ENABLED=false` can force it
    # off); a skipped build uploads no `android-release-apk` artifact, so
    # downloading here would fail the whole run even though the Windows
    # release published fine. `always()` keeps the job evaluated when a
    # dependency was skipped, but every needed `result == 'success'` means a
    # skip is skipped (not failed) and a real failure still leaves the run red
    # through the failing job itself.
    # `verify` is listed so a red test suite keeps APKs off the draft release.
    if: ${{ always() && needs.verify.result == 'success' && needs.build.result == 'success' && needs.sign-android.result == 'success' && needs.publish.result == 'success' }}
    needs: [verify, build, sign-android, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Restore Android release asset
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: android-release-apk
          path: dist/android

      - name: Upload Android APKs to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          shopt -s nullglob
          assets=(dist/android/SecPivot-*-android-*.apk dist/android/SHA256SUMS-android.txt)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Android release asset found under dist/android/." >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
            echo "Uploaded $(basename "$asset")"
          done
