name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Tag push → use the pushed tag; manual dispatch → build the tag from the
  # version input so `tauri-action` names the release/tag consistently.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Verify extreme release build
        env:
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: cargo build -j 2 --profile release --manifest-path src-tauri/Cargo.toml

  build:
    name: Build (Windows x64)
    needs: verify
    runs-on: windows-latest
    env:
      # Extreme runtime optimization is enabled ONLY here, in the GitHub release
      # build. Local `tauri build` and CI stay fast (see src-tauri/Cargo.toml).
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
      RUSTFLAGS: -C target-cpu=x86-64-v3
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Prepare release body
        id: release_body
        shell: bash
        run: |
          if [ -f RELEASE.md ]; then
            echo "body<<BODY_EOF" >> "$GITHUB_OUTPUT"
            cat RELEASE.md >> "$GITHUB_OUTPUT"
            echo "BODY_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body=See CHANGELOG.md for details." >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "SecPivot Desktop v__VERSION__"
          releaseBody: ${{ steps.release_body.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

      - name: Package portable ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $exe = "${{ github.workspace }}\src-tauri\target\release\secpivot-desktop.exe"
          $ver = $env:RELEASE_TAG.TrimStart("v")
          if (Test-Path $exe) {
            & scripts/package-portable.ps1 -SkipBuild -ReleaseExe $exe -Version $ver
          } else {
            Write-Host "Portable exe not found at $exe — skipping portable package."
          }

      - name: Upload portable ZIP to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $zip = Get-ChildItem "dist\SecPivot-*-portable.zip" -ErrorAction SilentlyContinue
          if ($zip) {
            gh release upload "$env:RELEASE_TAG" $zip.FullName --clobber
            Write-Host "Uploaded $($zip.Name)"
          } else {
            Write-Host "No portable ZIP found — nothing to upload."
          }

  android:
    name: Build (Android APK)
    needs: build
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK (debug)
        run: npx tauri android build --debug
        working-directory: src-tauri

      - name: Upload Android APK to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $apk = Get-ChildItem "src-tauri\gen\android\*.apk" -Recurse -ErrorAction SilentlyContinue
          if ($apk) {
            foreach ($a in $apk) {
              gh release upload "$env:RELEASE_TAG" $a.FullName --clobber
              Write-Host "Uploaded $($a.Name)"
            }
          } else {
            Write-Host "No Android APK found — nothing to upload."
          }
