name: "Android Build"

# 构建并签名安卓 APK。需要具备 Android 工具链的运行器（self-hosted）或
# 已配置 Android SDK 的 GitHub-hosted 环境。
#
# 注意：本仓库桌面端 `npm run verify` 在 `ci.yml` 执行；此工作流专用于移动端，
# 仍需先在后端 `cargo build` 通过且补充完 `#[cfg(desktop)]` 裁剪后再启用排错。

on:
  workflow_dispatch:
  # 开启后可由 tag 或 push 触发（建议先用 workflow_dispatch 冒烟）
  # push:
  #   branches: [main]

jobs:
  android:
    runs-on: windows-latest
    env:
      # 指向本地/有网下载 keepass 0.13.x 的完整 cargo 环境
      CARGO_NET_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install frontend deps
        run: npm ci

      - name: Build Android APK (debug)
        run: npx tauri android build --debug
        working-directory: src-tauri
